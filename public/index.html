<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flightmon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1416' stroke='%233a6b63' stroke-width='2'/%3E%3Cpath d='M16 7l5 15-5-3-5 3z' fill='%237cf3c8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Flightmon</h1>
    <form id="location-form" autocomplete="off">
      <label>Latitude <input id="lat" name="lat" inputmode="decimal" placeholder="55.6761" required></label>
      <label>Longitude <input id="lon" name="lon" inputmode="decimal" placeholder="12.5683" required></label>
      <label>Range <input id="range" name="range" type="number" min="1" max="463" step="1" required> km</label>
      <button type="submit">Show</button>
      <button type="button" id="locate">Use my location</button>
    </form>
  </header>
  <main>
    <section class="radar">
      <canvas id="radar" role="img" aria-label="Radar showing nearby aircraft"></canvas>
      <p id="legend" class="legend" aria-label="Altitude colours"></p>
      <p id="attribution" class="attribution"></p>
    </section>
    <section class="list">
      <p id="status" class="status" role="status"></p>
      <table id="aircraft">
        <thead>
          <tr>
            <th>Flight</th>
            <th>Type</th>
            <th class="num">Altitude</th>
            <th class="num">Speed</th>
            <th class="num">Distance</th>
            <th>Direction</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>
</body>
</html>
