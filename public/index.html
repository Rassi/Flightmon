<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flightmon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b1416' stroke='%233a6b63' stroke-width='2'/%3E%3Cpath d='M16 7l5 15-5-3-5 3z' fill='%237cf3c8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Flightmon</h1>
    <button type="button" id="home" title="Back to home">Home</button>
    <button type="button" id="set-home" title="Make the middle of the map home (and this zoom its zoom)">Set home</button>
    <span class="rain">
      <button type="button" id="rain-toggle" class="toggle" aria-pressed="false">Rain</button>
      <span id="rain-status" class="rain-status"></span>
    </span>
    <label title="How often to ask for aircraft positions">Refresh
      <select id="refresh">
        <option value="5">5 s</option>
        <option value="10">10 s</option>
        <option value="30">30 s</option>
        <option value="60">1 min</option>
        <option value="120">2 min</option>
      </select>
      <button type="button" id="refresh-now" title="Refresh now" aria-label="Refresh now">↻</button>
    </label>
    <div class="now">
      <p class="clock" title="Time at home"><span id="clock-time" class="clock-time"></span> <span id="clock-zone" class="muted"></span> <span id="clock-utc" class="muted"></span></p>
      <p id="weather" class="weather" aria-live="polite"></p>
    </div>
  </header>
  <main>
    <section class="radar">
      <canvas id="radar" role="img" aria-label="Map of aircraft"></canvas>
      <p id="legend" class="legend" aria-label="Altitude colours"></p>
      <div class="corner">
        <div class="zoom">
          <button type="button" id="zoom-in" title="Zoom in (around the middle)" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-out" title="Zoom out (around the middle)" aria-label="Zoom out">−</button>
        </div>
        <p id="attribution" class="attribution"></p>
      </div>
    </section>
    <section class="list">
      <section id="details" class="details" aria-live="polite" hidden></section>
      <p id="status" class="status" role="status"></p>
      <table id="aircraft">
        <thead>
          <tr>
            <th>Flight</th>
            <th>Type</th>
            <th class="num">Altitude</th>
            <th class="num">Speed</th>
            <th class="num" title="From home">Distance</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>
</body>
</html>
